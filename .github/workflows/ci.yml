name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
      - name: Cài Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Chạy test và đo coverage
        run: python -m pytest --cov=app --cov=modules --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Lưu báo cáo coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
  docker:
    name: Docker build and healthcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag ai-career-coach:ci .
      - name: Start container and check local health endpoint
        shell: bash
        run: |
          docker run --detach --name ai-career-coach-ci -p 8501:8501 ai-career-coach:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              docker logs ai-career-coach-ci
              exit 0
            fi
            sleep 2
          done
          docker logs ai-career-coach-ci
          exit 1
      - name: Cleanup container
        if: always()
        run: docker rm --force ai-career-coach-ci || true
