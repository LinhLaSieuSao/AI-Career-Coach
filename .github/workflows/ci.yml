name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check Docker Python default
        run: test "$(cat .python-version)" = "$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile | head -1)"
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Check dependency lock is current
        run: |
          python -m pip install uv==0.13.1
          uv pip compile requirements.txt --universal --python-version "$(cat .python-version)" --generate-hashes --output-file requirements.lock --quiet
          git diff --exit-code -- requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Lint (informational)
        run: ruff check --exit-zero .
      - name: Unit and Streamlit AppTest
        run: >-
          python -m pytest -q
          tests/test_cv_parser.py tests/test_profile.py
          tests/test_skill_extractor.py tests/test_matcher.py
          tests/test_recommender.py tests/test_interview.py
          tests/test_data_integrity.py tests/test_ui_smoke.py

  docker:
    name: Docker build, health, and secret check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image with repository Python version
        run: docker build --build-arg PYTHON_VERSION="$(cat .python-version)" --tag ai-career-coach:ci .
      - name: Check container health
        shell: bash
        run: |
          docker run --detach --name ai-career-coach-ci -p 8501:8501 ai-career-coach:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs ai-career-coach-ci
          exit 1
      - name: Check every image layer for private filenames
        shell: bash
        run: |
          docker save ai-career-coach:ci -o image.tar
          python - <<'PY'
          import io
          import tarfile

          leaked = []
          with tarfile.open("image.tar") as image:
              for layer in (item for item in image if item.name.endswith("/layer.tar")):
                  archive = tarfile.open(fileobj=io.BytesIO(image.extractfile(layer).read()))
                  with archive:
                      for member in archive:
                          name = member.name.removeprefix("./")
                          if not name.startswith("app/") or not member.isfile():
                              continue
                          filename = name.rsplit("/", 1)[-1].lower()
                          if filename == ".env" or filename.startswith(".env.") or filename.endswith((".pem", ".key")) or "token" in filename:
                              leaked.append(name)
          if leaked:
              raise SystemExit("Private filenames found in Docker layers: " + ", ".join(sorted(set(leaked))))
          print("No private filenames found in application layers")
          PY
      - name: Cleanup
        if: always()
        run: docker rm --force ai-career-coach-ci || true
